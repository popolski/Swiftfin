workflows:
  tvos-unsigned:
    name: tvOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "27.1"
    scripts:
      - name: Archive without code signing
        script: |
          set -euo pipefail
          xcodebuild archive \
            -project Swiftfin.xcodeproj \
            -scheme "Swiftfin tvOS" \
            -sdk appletvos \
            -destination "generic/platform=tvOS" \
            -configuration Release \
            -archivePath build/SwiftfinTV.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/SwiftfinTV.xcarchive/Products/Applications/*.app Payload/
          zip -r -y Swiftfin-tvOS-unsigned.ipa Payload
    artifacts:
      - Swiftfin-tvOS-unsigned.ipa
